<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>LiveMuse</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000000;
        }

        #jitsi {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<div id="jitsi"></div>

<script>

(function () {

    var APP_ID =
        "vpaas-magic-cookie-a50f99d633a44b0091e8c748a2e3dd1d";

    /*
     * Read values from URL hash:
     *
     * #room=ROOM&token=JWT&name=NAME
     */

    var hash = window.location.hash.substring(1);

    var params = new URLSearchParams(hash);

    var room = params.get("room");
    var token = params.get("token");
    var name = params.get("name");

    if (!room) {

        document.body.innerHTML =
            "<div style='color:white;text-align:center;padding:30px'>" +
            "Missing call room" +
            "</div>";

        return;
    }

    if (!token) {

        document.body.innerHTML =
            "<div style='color:white;text-align:center;padding:30px'>" +
            "Missing secure video token" +
            "</div>";

        return;
    }

    if (!name || name.length === 0) {
        name = "LiveMuse User";
    }

    /*
     * Load the JaaS IFrame API.
     */

    var script =
        document.createElement("script");

    script.src =
        "https://8x8.vc/" +
        APP_ID +
        "/external_api.js";

    script.onload = function () {

        startJaas();
    };

    script.onerror = function () {

        showError(
            "Unable to load secure video"
        );
    };

    document.head.appendChild(script);


    function startJaas() {

        try {

            /*
             * JaaS room name MUST include AppID.
             */

            var fullRoom =
                APP_ID + "/" + room;

            console.log(
                "LiveMuse JaaS room:",
                fullRoom
            );

            var options = {

                roomName: fullRoom,

                jwt: token,

                parentNode:
                    document.getElementById("jitsi"),

                width: "100%",

                height: "100%",

                userInfo: {

                    displayName: name

                },

                configOverwrite: {

                    prejoinConfig: {

                        enabled: false,

                        hideDisplayName: false

                    },

                    startWithAudioMuted: false,

                    startWithVideoMuted: false,

                    disableInitialGUM: false,

                    enableWelcomePage: false

                },

                interfaceConfigOverwrite: {

                    TOOLBAR_BUTTONS: [

                        "microphone",

                        "camera",

                        "hangup",

                        "tileview"

                    ],

                    SHOW_JITSI_WATERMARK: false,

                    SHOW_WATERMARK_FOR_GUESTS: false,

                    SHOW_BRAND_WATERMARK: false,

                    MOBILE_APP_PROMO: false,

                    DISABLE_JOIN_LEAVE_NOTIFICATIONS: true

                }

            };


            var api =
                new JitsiMeetExternalAPI(
                    "8x8.vc",
                    options
                );


            api.addEventListener(
                "videoConferenceJoined",
                function () {

                    console.log(
                        "LIVEMUSE_JOINED"
                    );

                    if (
                        window.Android &&
                        typeof window.Android.onVideoJoined ===
                        "function"
                    ) {

                        window.Android.onVideoJoined();

                    }

                }
            );


            api.addEventListener(
                "videoConferenceLeft",
                function () {

                    console.log(
                        "LIVEMUSE_LEFT"
                    );

                    if (
                        window.Android &&
                        typeof window.Android.onVideoLeft ===
                        "function"
                    ) {

                        window.Android.onVideoLeft();

                    }

                }
            );


            api.addEventListener(
                "cameraError",
                function () {

                    notifyError(
                        "Camera error"
                    );

                }
            );


            api.addEventListener(
                "micError",
                function () {

                    notifyError(
                        "Microphone error"
                    );

                }
            );


            api.addEventListener(
                "errorOccurred",
                function (event) {

                    console.log(
                        "JaaS error:",
                        event
                    );

                    notifyError(
                        "Secure video connection error"
                    );

                }
            );


        } catch (error) {

            console.log(
                "JaaS startup error:",
                error
            );

            showError(
                "Unable to start secure video"
            );

        }

    }


    function notifyError(message) {

        if (
            window.Android &&
            typeof window.Android.onVideoError ===
            "function"
        ) {

            window.Android.onVideoError(
                message
            );

        }

    }


    function showError(message) {

        document.body.innerHTML =
            "<div style='" +
            "color:white;" +
            "background:#000;" +
            "width:100%;" +
            "height:100%;" +
            "display:flex;" +
            "align-items:center;" +
            "justify-content:center;" +
            "text-align:center;" +
            "font-family:Arial;" +
            "font-size:16px;" +
            "'>" +
            message +
            "</div>";

        notifyError(message);

    }

})();

</script>

</body>
</html>
