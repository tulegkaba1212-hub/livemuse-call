<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>LiveMuse Call</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
        }

        #jitsi-container {
            width: 100%;
            height: 100%;
            background: #000000;
        }
    </style>

    <script src="https://meet.jit.si/external_api.js"></script>
</head>

<body>

<div id="jitsi-container"></div>

<script>
(function () {

    var params = new URLSearchParams(window.location.search);
    var room = params.get("room");
    var name = params.get("name");

    if (!room) {
        document.body.innerHTML =
            "<div style='color:white;text-align:center;padding:30px;font-family:Arial'>" +
            "Missing room" +
            "</div>";
        return;
    }

    if (!name) {
        name = "LiveMuse User";
    }

    var container = document.getElementById("jitsi-container");

    var api = new JitsiMeetExternalAPI("meet.jit.si", {
        roomName: room,
        parentNode: container,

        userInfo: {
            displayName: name
        },

        configOverwrite: {
            prejoinConfig: {
                enabled: false
            },

            disableAP: true,

            startWithAudioMuted: false,
            startWithVideoMuted: false
        },

        interfaceConfigOverwrite: {
            TOOLBAR_BUTTONS: [
                "microphone",
                "camera",
                "hangup",
                "tileview"
            ],

            SHOW_JITSI_WATERMARK: false,
            SHOW_WATERMARK_FOR_GUESTS: false,
            SHOW_BRAND_WATERMARK: false,
            MOBILE_APP_PROMO: false
        }
    });

    api.addEventListener("videoConferenceJoined", function (event) {

        console.log("LiveMuse: videoConferenceJoined");

        if (window.Android &&
            typeof window.Android.onVideoJoined === "function") {

            window.Android.onVideoJoined();
        }
    });

    api.addEventListener("videoConferenceLeft", function (event) {

        console.log("LiveMuse: videoConferenceLeft");

        if (window.Android &&
            typeof window.Android.onVideoLeft === "function") {

            window.Android.onVideoLeft();
        }
    });

    api.addEventListener("cameraError", function (event) {

        console.log("LiveMuse: cameraError");

        if (window.Android &&
            typeof window.Android.onVideoError === "function") {

            window.Android.onVideoError("Camera error");
        }
    });

    api.addEventListener("micError", function (event) {

        console.log("LiveMuse: micError");

        if (window.Android &&
            typeof window.Android.onVideoError === "function") {

            window.Android.onVideoError("Microphone error");
        }
    });

})();
</script>

</body>
</html>
