<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>LiveMuse Call</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
        }

        #jitsi {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        #status {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            padding: 8px;
            z-index: 9999;
            background: rgba(0,0,0,0.75);
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 12px;
            text-align: center;
            pointer-events: none;
        }

    </style>

</head>

<body>

<div id="jitsi"></div>

<div id="status">
    Starting LiveMuse...
</div>

<script src="https://meet.jit.si/external_api.js"></script>

<script>

var api = null;

function setStatus(text) {

    var status =
        document.getElementById("status");

    if (status) {
        status.innerHTML = text;
    }
}

function getRoom() {

    var params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("room") || "";
}

function startCall() {

    var room = getRoom();

    if (!room) {

        setStatus(
            "ERROR: No room"
        );

        return;
    }

    setStatus(
        "Connecting..."
    );

    if (typeof JitsiMeetExternalAPI === "undefined") {

        setStatus(
            "ERROR: Jitsi API not loaded"
        );

        return;
    }

    if (api !== null) {
        return;
    }

    api =
        new JitsiMeetExternalAPI(
            "meet.jit.si",
            {

                roomName: room,

                parentNode:
                    document.getElementById("jitsi"),

                width: "100%",

                height: "100%",

                userInfo: {
                    displayName: "LiveMuse User"
                },

                configOverwrite: {

                    prejoinConfig: {
                        enabled: false
                    },

                    enableWelcomePage: false,

                    enableClosePage: false,

                    requireDisplayName: false,

                    startWithAudioMuted: false,

                    startWithVideoMuted: false,

                    disableAP: true,

                    p2p: {
                        enabled: true
                    }
                },

                interfaceConfigOverwrite: {

                    TOOLBAR_BUTTONS: [
                        "microphone",
                        "camera",
                        "hangup",
                        "chat",
                        "tileview"
                    ],

                    MOBILE_APP_PROMO: false
                }
            }
        );

    api.addEventListener(
        "videoConferenceJoined",
        function (event) {

            setStatus(
                ""
            );

            try {

                if (
                    window.AndroidBridge
                    &&
                    window.AndroidBridge.onJoined
                ) {

                    window.AndroidBridge.onJoined();

                }

            } catch (e) {
            }

        }
    );

    api.addEventListener(
        "videoConferenceLeft",
        function (event) {

            try {

                if (
                    window.AndroidBridge
                    &&
                    window.AndroidBridge.onLeft
                ) {

                    window.AndroidBridge.onLeft();

                }

            } catch (e) {
            }

        }
    );

    api.addEventListener(
        "readyToClose",
        function () {

            try {

                if (
                    window.AndroidBridge
                    &&
                    window.AndroidBridge.onLeft
                ) {

                    window.AndroidBridge.onLeft();

                }

            } catch (e) {
            }

        }
    );

    api.addEventListener(
        "cameraError",
        function (event) {

            setStatus(
                "Camera error"
            );

            console.log(
                "Jitsi camera error",
                event
            );

        }
    );

    api.addEventListener(
        "micError",
        function (event) {

            setStatus(
                "Microphone error"
            );

            console.log(
                "Jitsi microphone error",
                event
            );

        }
    );

    api.addEventListener(
        "errorOccurred",
        function (event) {

            setStatus(
                "Jitsi error"
            );

            console.log(
                "Jitsi error",
                event
            );

        }
    );

    setStatus(
        "Jitsi loaded"
    );
}

window.onload =
    function () {

        startCall();

    };

</script>

</body>
</html>
