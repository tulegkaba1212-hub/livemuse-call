<!DOCTYPE html><html>
<head>
    <meta charset="UTF-8"><meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>LiveMuse Call</title>

<style>
    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000000;
        overflow: hidden;
    }

    #jitsi {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
    }
</style>

</head><body><div id="jitsi"></div><script src="https://meet.jit.si/external_api.js"></script><script>

var api = null;

function getRoom() {

    var params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("room") || "";
}

function startCall() {

    var room = getRoom();

    if (!room) {
        return;
    }

    if (typeof JitsiMeetExternalAPI === "undefined") {
        return;
    }

    if (api !== null) {
        return;
    }

    api =
        new JitsiMeetExternalAPI(
            "meet.jit.si",
            {

                roomName: room,

                parentNode:
                    document.getElementById("jitsi"),

                width: "100%",

                height: "100%",

                userInfo: {
                    displayName: "LiveMuse User"
                },

                configOverwrite: {

                    prejoinConfig: {
                        enabled: false
                    },

                    enableWelcomePage: false,

                    requireDisplayName: false,

                    startWithAudioMuted: false,

                    startWithVideoMuted: false,

                    p2p: {
                        enabled: true
                    }
                },

                interfaceConfigOverwrite: {

                    TOOLBAR_BUTTONS: [
                        "microphone",
                        "camera",
                        "hangup",
                        "chat",
                        "tileview"
                    ],

                    MOBILE_APP_PROMO: false
                }
            }
        );
}

window.onload =
    function () {

        startCall();

    };

</script></body>
</html>
